<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decisions · dashboard-skills</title>
<link rel="stylesheet" href="assets/shared.css">
<link rel="stylesheet" href="assets/feedback.css">
<style>
  .dec { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 0.75rem; }
  .dec summary { padding: 0.6rem 0.9rem; cursor: pointer; display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: baseline; }
  .dec summary::-webkit-details-marker { display: none; }
  .dec summary::before { content: "▸ "; color: var(--muted); margin-right: 0.25rem; }
  .dec[open] summary::before { content: "▾ "; }
  .dec .id { color: var(--muted); font-family: var(--mono); font-size: 0.85rem; }
  .dec .subject { font-weight: 600; }
  .dec .body { padding: 0 0.9rem 0.9rem; }
  .dec .by-agent  { background: #dbeafe; color: #1e3a8a; }
  .dec .by-human  { background: #dcfce7; color: #166534; }
  .dec .kind-choice    { background: var(--surface-alt); color: var(--muted); }
  .dec .kind-override  { background: #fef3c7; color: #92400e; }
  .dec .kind-revision  { background: #fce7f3; color: #9d174d; }
  @media (prefers-color-scheme: dark) {
    .dec .by-agent  { background: #172554; color: #93c5fd; }
    .dec .by-human  { background: #052e16; color: #86efac; }
    .dec .kind-override { background: #451a03; color: #fcd34d; }
    .dec .kind-revision { background: #500724; color: #f9a8d4; }
  }
  .alt-list { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .alt-list code { font-size: 0.82rem; }
</style>
</head>
<body>
<div id="nav-mount"></div>
<main class="wrap">
  <h1>Decision audit</h1>
  <p class="subtitle">Every design call this session, with rationale and provenance. Source: <code>docs/agent-state/claude/decisions.jsonl</code>.</p>
  <div id="page"></div>
</main>
<footer class="bottom">
  decisions.jsonl — append-only · <code>kind: choice | override | revision</code> · <code>made_by: agent | human:&lt;login&gt;</code>
</footer>
<script src="assets/shared.js"></script>
<script>
mountNav("decisions.html");

(async () => {
  const page = document.getElementById("page");
  try {
    const decisions = await fetchJSONL("agent-state/claude/decisions.jsonl");
    decisions.sort((a, b) => b.ts.localeCompare(a.ts));

    page.innerHTML = `
      ${decisions.map(d => {
        const byCls = d.made_by.startsWith("human") ? "by-human" : "by-agent";
        const byLabel = d.made_by.startsWith("human") ? d.made_by.replace("human:", "human · ") : "agent";
        return `
        <details class="dec" id="${escapeHTML(d.id)}" data-artifact="docs/agent-state/claude/decisions.jsonl" data-record-id="${escapeHTML(d.id)}" data-agent-id="${escapeHTML(d.agent_id)}">
          <summary>
            <span class="id">${escapeHTML(d.id)}</span>
            <span class="badge kind-${escapeHTML(d.kind)}">${escapeHTML(d.kind)}</span>
            <span class="badge ${byCls}">${escapeHTML(byLabel)}</span>
            <span class="subject">${escapeHTML(d.subject)}</span>
            <span class="muted small mono" style="margin-left: auto;" data-source="docs/agent-state/claude/decisions.jsonl" data-fresh-at="${escapeHTML(d.ts)}">${escapeHTML(d.ts.replace("T", " ").replace("Z", ""))}</span>
          </summary>
          <div class="body">
            <dl class="kv">
              <dt>chose</dt>
              <dd>${escapeHTML(d.chosen)}</dd>
              ${d.alternatives && d.alternatives.length ? `
                <dt>over</dt>
                <dd class="alt-list">${d.alternatives.map(a => `<code>${escapeHTML(a)}</code>`).join("")}</dd>
              ` : ""}
              <dt>rationale</dt>
              <dd>${escapeHTML(d.rationale)}</dd>
              ${d.evidence && d.evidence.length ? `
                <dt>evidence</dt>
                <dd class="evidence-list">${d.evidence.map(e => `<code>${escapeHTML(e)}</code>`).join(" &nbsp; ")}</dd>
              ` : ""}
              ${d.supersedes ? `<dt>supersedes</dt><dd class="mono small">${escapeHTML(d.supersedes)}</dd>` : ""}
            </dl>
          </div>
        </details>`;
      }).join("")}
    `;
    // Auto-expand the hash-targeted decision
    if (location.hash) {
      const el = document.querySelector(location.hash);
      if (el && el.tagName.toLowerCase() === "details") el.open = true;
    }
  } catch (e) { renderError(page, e); }
})();
</script>
<script src="assets/feedback.js"></script>
</body>
</html>

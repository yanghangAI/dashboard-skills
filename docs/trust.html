<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trust · dashboard-skills</title>
<link rel="stylesheet" href="assets/shared.css">
<link rel="stylesheet" href="assets/feedback.css">
<style>
  .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.85rem; }
  .metric { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.85rem 1rem; }
  .metric .n { font-size: 1.75rem; font-weight: 700; font-family: var(--mono); }
  .metric .l { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.15rem; }
  .metric .desc { font-size: 0.78rem; color: var(--muted); margin-top: 0.3rem; }
  .empty-banner {
    background: var(--accent-bg); border: 1px solid var(--accent); border-radius: var(--radius);
    padding: 0.85rem 1rem; margin-bottom: 1rem; font-size: 0.92rem;
  }
</style>
</head>
<body>
<div id="nav-mount"></div>
<main class="wrap">
  <h1>Trust calibration</h1>
  <p class="subtitle">How often the agent's first action is accepted vs. corrected vs. overridden, derived from GitHub Issues history. Source: <code>https://api.github.com/repos/yanghangAI/dashboard-skills/issues</code>.</p>
  <div id="page"></div>
</main>
<footer class="bottom">
  Metrics: <code>accepted · fixed · overridden · blocked-open · override-rate · mean-time-to-fix</code>
</footer>
<script src="assets/shared.js"></script>
<script>
mountNav("trust.html");

(async () => {
  const page = document.getElementById("page");
  const API = `https://api.github.com/repos/yanghangAI/dashboard-skills/issues`;
  try {
    // Fetch all comment-labeled issues (open + closed) for the full picture
    const [openIssues, closedIssues] = await Promise.all([
      fetch(`${API}?state=open&labels=comment&per_page=100&_t=${Date.now()}`, { cache: "no-store" })
        .then(r => r.ok ? r.json() : []),
      fetch(`${API}?state=closed&labels=comment&per_page=100&_t=${Date.now()}`, { cache: "no-store" })
        .then(r => r.ok ? r.json() : []),
    ]);
    const all = [...openIssues, ...closedIssues];

    const hasLabel = (issue, name) => issue.labels.some(l => (l.name || l) === name);
    const tier = i =>
      hasLabel(i, "override")  ? "override" :
      hasLabel(i, "block")     ? "block"    :
      hasLabel(i, "claude-fix") ? "fix"     : "fyi";

    const now = Date.now();
    const within = (issue, days) => (now - Date.parse(issue.created_at)) <= days * 86400000;

    function counts(scope) {
      const closed = scope.filter(i => i.state === "closed");
      const open   = scope.filter(i => i.state === "open");
      return {
        accepted:    closed.filter(i => tier(i) === "fyi").length,
        fixed:       closed.filter(i => tier(i) === "fix").length,
        overridden:  closed.filter(i => tier(i) === "override").length,
        blockedOpen: open.filter(i => tier(i) === "block").length,
        all,
        closed, open,
      };
    }

    const c7  = counts(all.filter(i => within(i, 7)));
    const c30 = counts(all.filter(i => within(i, 30)));
    const cAll = counts(all);

    function overrideRate(c) {
      const d = c.fixed + c.overridden;
      return d === 0 ? "—" : `${Math.round((c.overridden / d) * 100)}%`;
    }

    function mttf(c) {
      const fixedClosed = c.closed.filter(i => tier(i) === "fix");
      if (!fixedClosed.length) return "—";
      const ages = fixedClosed.map(i => Date.parse(i.closed_at) - Date.parse(i.created_at));
      const median = ages.sort((a, b) => a - b)[Math.floor(ages.length / 2)];
      const min = Math.floor(median / 60000);
      if (min < 60) return `${min} min`;
      if (min < 1440) return `${Math.floor(min / 60)} h`;
      return `${Math.floor(min / 1440)} d`;
    }

    function tile(label, n, desc) {
      return `<div class="metric"><div class="l">${label}</div><div class="n">${n}</div><div class="desc">${desc}</div></div>`;
    }

    page.innerHTML = `
      ${cAll.all.length === 0 ? `
        <div class="empty-banner">
          <strong>No comments yet.</strong> This is a fresh dogfood dashboard; trust signals appear once humans start filing severity-tiered issues via the comment overlay (try selecting text on any page).
        </div>` : ""}

      <section class="section" data-source="${API}" data-fresh-at="${new Date().toISOString()}">
        <h2>Last 7 days</h2>
        <div class="metric-grid">
          ${tile("accepted", c7.accepted, "FYI issues closed by the human")}
          ${tile("fixed", c7.fixed, "Fix issues closed by fix-feedback")}
          ${tile("overridden", c7.overridden, "Risk knowingly accepted")}
          ${tile("blocked-open", c7.blockedOpen, "Block issues waiting on human")}
          ${tile("override-rate", overrideRate(c7), "overridden / (fixed + overridden)")}
          ${tile("mean-time-to-fix", mttf(c7), "median Fix issue lifetime")}
        </div>
      </section>

      <section class="section" data-source="${API}" data-fresh-at="${new Date().toISOString()}">
        <h2>Last 30 days</h2>
        <div class="metric-grid">
          ${tile("accepted", c30.accepted, "FYI issues closed by the human")}
          ${tile("fixed", c30.fixed, "Fix issues closed by fix-feedback")}
          ${tile("overridden", c30.overridden, "Risk knowingly accepted")}
          ${tile("blocked-open", c30.blockedOpen, "Block issues waiting on human")}
          ${tile("override-rate", overrideRate(c30), "overridden / (fixed + overridden)")}
          ${tile("mean-time-to-fix", mttf(c30), "median Fix issue lifetime")}
        </div>
      </section>

      <section class="section">
        <h2>How to read this</h2>
        <p>The <strong>override-rate</strong> is the headline trust signal: how often did the agent's first action get reversed by a human override? Low rate → agent and human are aligned. High rate → agent's defaults disagree with the human in this area; consider tightening the agent's plan or adding human-in-the-loop checkpoints there.</p>
        <p><strong>blocked-open</strong> rising means the agent is increasingly stuck waiting on human input — possibly an under-scoped permission boundary.</p>
        <p class="muted small">Metrics are derivable purely from <code>gh issue list</code> + label combinations + closure comments. No additional infrastructure required.</p>
      </section>
    `;
  } catch (e) { renderError(page, e); }
})();
</script>
<script src="assets/feedback.js"></script>
</body>
</html>

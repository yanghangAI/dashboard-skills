<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline · dashboard-skills</title>
<link rel="stylesheet" href="assets/shared.css">
<link rel="stylesheet" href="assets/feedback.css">
<style>
  .ev { display: grid; grid-template-columns: 11rem 7rem 1fr; gap: 0.6rem 1rem; padding: 0.45rem 0; border-bottom: 1px solid var(--border); align-items: baseline; }
  .ev:last-child { border-bottom: none; }
  .ev .when { color: var(--muted); font-family: var(--mono); font-size: 0.82rem; }
  .ev .kind { font-family: var(--mono); }
  .ev .what code { font-size: 0.85em; }
  .filter-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
  .filter-bar button {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 0.2rem 0.7rem; border-radius: 999px; cursor: pointer; font-size: 0.82rem; font-family: var(--mono);
  }
  .filter-bar button.active { background: var(--accent); color: white; border-color: var(--accent); }
  @media (max-width: 700px) {
    .ev { grid-template-columns: 1fr; gap: 0.2rem; }
  }
</style>
</head>
<body>
<div id="nav-mount"></div>
<main class="wrap">
  <h1>Activity timeline</h1>
  <p class="subtitle">Every action the agent has taken, reverse-chronological. Source: <code>docs/agent-state/claude/events.jsonl</code>.</p>
  <div id="page"></div>
</main>
<footer class="bottom">
  events.jsonl — append-only · sorted descending by <code>ts</code>
</footer>
<script src="assets/shared.js"></script>
<script>
mountNav("timeline.html");

(async () => {
  const page = document.getElementById("page");
  try {
    const events = await fetchJSONL("agent-state/claude/events.jsonl");
    events.sort((a, b) => b.ts.localeCompare(a.ts));

    const kinds = [...new Set(events.map(e => e.kind))].sort();
    let activeKind = "all";

    function render() {
      const filtered = activeKind === "all" ? events : events.filter(e => e.kind === activeKind);
      page.innerHTML = `
        <div class="filter-bar">
          <button data-k="all"${activeKind === "all" ? ' class="active"' : ''}>all (${events.length})</button>
          ${kinds.map(k => `<button data-k="${escapeHTML(k)}"${activeKind === k ? ' class="active"' : ''}>${escapeHTML(k)} (${events.filter(e => e.kind === k).length})</button>`).join("")}
        </div>
        <section class="section">
          ${filtered.map(e => `
            <div class="ev" data-artifact="docs/agent-state/claude/events.jsonl" data-record-id="${escapeHTML(e.id)}" data-agent-id="${escapeHTML(e.agent_id)}">
              <span class="when" data-source="docs/agent-state/claude/events.jsonl" data-fresh-at="${escapeHTML(e.ts)}">${escapeHTML(e.ts.replace("T", " ").replace("Z", ""))}</span>
              <span class="kind"><span class="badge badge-info">${escapeHTML(e.kind)}</span></span>
              <span class="what">
                ${escapeHTML(e.summary)}
                ${e.ref ? `<div class="prov">ref <code>${escapeHTML(e.ref)}</code></div>` : ""}
                ${e.path ? `<div class="prov">path <code>${escapeHTML(e.path)}</code></div>` : ""}
                ${e.decision_id ? `<div class="prov">decision <code>${escapeHTML(e.decision_id)}</code> → <a href="decisions.html#${escapeHTML(e.decision_id)}">view</a></div>` : ""}
                ${e.step_id ? `<div class="prov">step <code>${escapeHTML(e.step_id)}</code> · <code>${escapeHTML(e.from_status || "")}</code> → <code>${escapeHTML(e.to_status || "")}</code></div>` : ""}
              </span>
            </div>`).join("")}
        </section>
      `;
      page.querySelectorAll(".filter-bar button").forEach(b => {
        b.addEventListener("click", () => { activeKind = b.dataset.k; render(); });
      });
    }
    render();
  } catch (e) { renderError(page, e); }
})();
</script>
<script src="assets/feedback.js"></script>
</body>
</html>

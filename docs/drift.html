<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drift · dashboard-skills</title>
<link rel="stylesheet" href="assets/shared.css">
<link rel="stylesheet" href="assets/feedback.css">
<style>
  .drift-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .drift-grid > section { margin-bottom: 0; }
  @media (max-width: 800px) { .drift-grid { grid-template-columns: 1fr; } }
  .drift-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;
    padding: 0.5rem 0; border-bottom: 1px solid var(--border);
  }
  .drift-row:last-child { border-bottom: none; }
  .drift-row > div { padding: 0.25rem 0.5rem; border-radius: 3px; }
  .drift-row .ok-cell    { background: rgba(22, 163, 74, 0.08); }
  .drift-row .diverge    { background: rgba(217, 119, 6, 0.10); }
  .drift-row .pending    { background: rgba(120, 113, 108, 0.08); color: var(--muted); }
  .risk-row {
    display: grid; grid-template-columns: 6rem 1fr 6rem; gap: 0.5rem;
    padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--border); align-items: baseline;
  }
  .risk-row:last-child { border-bottom: none; }
</style>
</head>
<body>
<div id="nav-mount"></div>
<main class="wrap">
  <h1>Drift — plan vs actual</h1>
  <p class="subtitle">Where the agent's planned work diverges from the repo's current state. Source: <code>plan.json</code> ⨯ <code>claims.json</code> ⨯ <code>risks.json</code>.</p>
  <div id="page"></div>
</main>
<footer class="bottom">
  Drift surfaces: planned-not-done · facts-without-evidence · risks open beyond mitigation
</footer>
<script src="assets/shared.js"></script>
<script>
mountNav("drift.html");

(async () => {
  const page = document.getElementById("page");
  try {
    const [plan, claims, risks] = await Promise.all([
      fetchJSON("agent-state/claude/plan.json"),
      fetchJSON("agent-state/claude/claims.json"),
      fetchJSON("agent-state/claude/risks.json"),
    ]);

    // Plan-vs-claims drift: which plan steps are not verified vs what claims say about repo state
    // For this dogfood: s4 (build dashboard) is running, s5+s6+s7 are proposed → "drafts not committed, no deploy yet"
    const planActual = plan.steps.map(s => {
      let actualStatus, divergence;
      if (s.status === "verified") {
        actualStatus = "complete";
        divergence = "ok-cell";
      } else if (s.status === "running") {
        actualStatus = "in progress (see Live Status)";
        divergence = "ok-cell";
      } else {
        actualStatus = "not yet started";
        divergence = "pending";
      }
      return { step: s, actualStatus, divergence };
    });

    // Headline drift: scheduled v2 release vs current state
    const releaseClaim = claims.claims.find(c => c.id === "v2_release_status");
    const draftsClaim = claims.claims.find(c => c.id === "drafts_pending");

    page.innerHTML = `
      <section class="section" data-artifact="docs/agent-state/claude/claims.json" data-record-id="v2_release_status" data-agent-id="claude">
        <h2>Headline drift</h2>
        <p>
          <strong>Plan says:</strong> finish building, then commit drafts (s5) and deploy gh-pages (s6).<br>
          <strong>Repo says:</strong> <span data-source="${escapeHTML(releaseClaim.source)}" data-fresh-at="${escapeHTML(releaseClaim.verified_at)}">${escapeHTML(releaseClaim.value)}</span>
          (${escapeHTML(draftsClaim.value)} .draft files awaiting promotion).
        </p>
        <p class="muted small">→ s5 and s6 are unblocked but not yet started. s7 (add public-passthrough auth mode to methodology) depends on this dogfood validating the approach.</p>
      </section>

      <section class="section" data-artifact="docs/agent-state/claude/plan.json" data-agent-id="claude">
        <h2>Plan steps vs actual</h2>
        <div class="drift-row" style="font-weight: 600; color: var(--muted);">
          <div>plan.json says</div><div>actual</div>
        </div>
        ${planActual.map(({ step, actualStatus, divergence }) => `
          <div class="drift-row" data-artifact="docs/agent-state/claude/plan.json" data-record-id="${escapeHTML(step.id)}" data-agent-id="claude">
            <div>
              <span class="badge status-${escapeHTML(step.status)}">${escapeHTML(step.status)}</span>
              <span class="muted mono small">${escapeHTML(step.id)}</span>
              &nbsp;${escapeHTML(step.summary)}
            </div>
            <div class="${divergence}">${escapeHTML(actualStatus)}</div>
          </div>
        `).join("")}
      </section>

      <section class="section" data-artifact="docs/agent-state/claude/risks.json" data-agent-id="claude">
        <h2>Open risks (drift the agent has flagged)</h2>
        ${risks.risks.length ? risks.risks.filter(r => r.status === "open").map(r => `
          <div class="risk-row" data-artifact="docs/agent-state/claude/risks.json" data-record-id="${escapeHTML(r.id)}" data-agent-id="claude">
            <span class="badge badge-${r.severity === 'high' ? 'bad' : r.severity === 'medium' ? 'warn' : 'muted'}">${escapeHTML(r.severity)}</span>
            <span>${escapeHTML(r.summary)}<div class="prov">mitigation: ${escapeHTML(r.mitigation)}</div></span>
            <span class="muted small mono right">${escapeHTML(r.id)}</span>
          </div>`).join("") : `<p class="muted">No open risks.</p>`}
        ${risks.risks.filter(r => r.status === "accepted").length ? `
          <details style="margin-top: 1rem;">
            <summary>accepted risks (${risks.risks.filter(r => r.status === "accepted").length})</summary>
            <div style="margin-top: 0.5rem;">
              ${risks.risks.filter(r => r.status === "accepted").map(r => `
                <div class="risk-row" data-artifact="docs/agent-state/claude/risks.json" data-record-id="${escapeHTML(r.id)}" data-agent-id="claude">
                  <span class="badge badge-muted">accepted</span>
                  <span>${escapeHTML(r.summary)}</span>
                  <span class="muted small mono right">${escapeHTML(r.id)}</span>
                </div>`).join("")}
            </div>
          </details>` : ""}
      </section>

      <section class="section" id="drift-meaning">
        <h2>What "drift" means here</h2>
        <p>For a project mid-flight, drift = the gap between what the agent <em>planned</em> and what the repo currently <em>contains</em>. The agent updates <code>plan.json</code> and <code>claims.json</code> as it works; this page joins them so the human can see the gap without reading both files.</p>
        <p class="muted small">For training projects: drift would also surface "plan says AdamW, <code>train_args.txt</code> says Adam." For doc projects: "plan says ship v2 README, current README is v1."</p>
      </section>
    `;
    document.dispatchEvent(new Event("dashboard:rendered"));
  } catch (e) { renderError(page, e); }
})();
</script>
<script src="assets/feedback.js"></script>
</body>
</html>
